name: Marketing site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sites/www/**'
      - 'packages/site_shared/**'
      - 'tool/dash_site/**'
      - 'tool/config/linkcheck-skip-list.txt'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/www.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sites/www/**'
      - 'packages/site_shared/**'
      - 'tool/dash_site/**'
      - 'tool/config/linkcheck-skip-list.txt'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/www.yml'
  # schedule:
  #   - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linkcheck:
    name: Build and check links
    runs-on: ubuntu-latest
    if: github.repository == 'cfug/flutter.cn'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.14.0-315.3.beta
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Install firebase-tools
        # Pinned because the hosting emulator fails to
        # start with firebase-tools 15.31.0.
        # Once https://github.com/firebase/firebase-tools/issues/11168 is fixed,
        # unpin or consider an automatic rolling process.
        env:
          FIREBASE_TOOLS_VERSION: 15.30.2
        run: |
          sudo curl -sSfLo /usr/local/bin/firebase \
            "https://firebase.tools/bin/linux/v${FIREBASE_TOOLS_VERSION}"
          sudo chmod +rx /usr/local/bin/firebase
          firebase --version
      - name: Build site
        run: dart run dash_site --site=www build
      - name: Check for broken Markdown link references
        run: dart run dash_site --site=www check-link-references
      - name: Check for broken internal links
        run: dart run dash_site --site=www check-links

  firebase-validate:
    name: Validate Firebase configuration
    runs-on: ubuntu-latest
    if: github.repository == 'cfug/flutter.cn'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.14.0-315.3.beta
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Validate the firebase.json file
        run: dart run dash_site --site=www verify-firebase-json

  deploy:
    name: Deploy to production
    needs: [linkcheck, firebase-validate]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'cfug/flutter.cn'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # docs.flutter.cn | https://github.com/cfug/flutter.cn/pull/1518
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: beta
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Build site
        run: dart run dash_site --site=www build --release
      - name: Deploy to production
        run: bash tool/deploy/deploy-cn-www.sh
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DOCS_REPO_DEPLOY_USER }}
          DEPLOY_TOKEN: ${{ secrets.DOCS_REPO_DEPLOY_TOKEN }}
